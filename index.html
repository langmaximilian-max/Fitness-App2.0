<script>
// Insert the app logo into the header when the DOM is ready (if not already present)
document.addEventListener('DOMContentLoaded', function(){
  try{
    var header = document.querySelector('header, .app-header');
    if(header && !header.querySelector('.app-logo')){
      var img = document.createElement('img');
      img.className = 'app-logo';
      img.src = 'strengthiq-logo.png';
      img.alt = 'StrengthIQ';
      // insert as first child so it appears on the left in the header
      header.insertBefore(img, header.firstChild);
    }
  }catch(e){console.warn('logo-insert failed', e);}
});
</script>
